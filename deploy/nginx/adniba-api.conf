##
## AdNiba API — Nginx vhost
## Optimised for high-throughput SDK traffic and low latency
##

# Rate-limit zones (defined at http{} level — add to /etc/nginx/nginx.conf)
# limit_req_zone $binary_remote_addr zone=sdk:10m rate=60r/s;
# limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.adniba.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.adniba.io;

    root /var/www/adniba/public;
    index index.php;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/adniba/fullchain.pem;
    ssl_certificate_key /etc/ssl/adniba/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options         DENY        always;
    add_header X-Content-Type-Options  nosniff     always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         no-referrer always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/adniba-access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/adniba-error.log warn;

    # ── Gzip (compress JSON responses) ───────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;
    gzip_comp_level 4;

    # ── SDK endpoints — aggressively rate-limited ─────────────────────────────
    location ~ ^/api/v1/ads/ {
        limit_req zone=sdk burst=100 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # Tune for fast SDK responses
        fastcgi_read_timeout  15s;
        fastcgi_send_timeout  15s;
        fastcgi_connect_timeout 5s;
    }

    # ── Admin endpoints — stricter rate limit ─────────────────────────────────
    location ~ ^/api/v1/admin/ {
        limit_req zone=admin burst=20 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        fastcgi_read_timeout  30s;
    }

    # ── Default PHP handler ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass  unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── Block dotfiles & sensitive paths ─────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /(\.env|composer\.(json|lock)|artisan) {
        deny all;
        return 404;
    }
}

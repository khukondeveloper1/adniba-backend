; ── AdNiba PHP production settings ───────────────────────────────────────────

; OPcache — mandatory for < 100 ms config API response time
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0     ; DISABLE in production, use deploy script to clear
opcache.save_comments=1

; Memory
memory_limit=256M

; Time limits
max_execution_time=30
default_socket_timeout=10

; Error reporting (suppress in production — log only)
display_errors=Off
log_errors=On
error_log=/var/log/php/error.log
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Upload / POST (API-only — kept small)
post_max_size=4M
upload_max_filesize=2M

; Realpath cache — speed up autoloader
realpath_cache_size=4M
realpath_cache_ttl=600

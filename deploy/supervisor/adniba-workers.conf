[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─────────────────────────────────────────────────────────────────────────────
; Events queue  —  high-throughput, 4 parallel workers
; Handles: TrackAdEvent jobs (millions of SDK events / day)
; ─────────────────────────────────────────────────────────────────────────────
[program:adniba-events-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/adniba/artisan queue:work redis \
    --queue=events \
    --sleep=1 \
    --tries=3 \
    --backoff=5,30,60 \
    --timeout=30 \
    --max-jobs=1000 \
    --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/adniba/events-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=30

; ─────────────────────────────────────────────────────────────────────────────
; Default queue  —  general background jobs (lower concurrency needed)
; ─────────────────────────────────────────────────────────────────────────────
[program:adniba-default-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/adniba/artisan queue:work redis \
    --queue=default \
    --sleep=3 \
    --tries=3 \
    --backoff=10,30,60 \
    --timeout=60 \
    --max-jobs=500 \
    --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/adniba/default-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=30

; ─────────────────────────────────────────────────────────────────────────────
; Group — allows `supervisorctl restart adniba:` to restart all workers
; ─────────────────────────────────────────────────────────────────────────────
[group:adniba]
programs=adniba-events-worker,adniba-default-worker

version: "3.9"

services:

  # ── PHP-FPM application server ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: adniba_app
    restart: unless-stopped
    working_dir: /var/www/adniba
    volumes:
      - .:/var/www/adniba
      - ./deploy/docker/php.ini:/usr/local/etc/php/conf.d/99-adniba.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - adniba

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: adniba_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/adniba:ro
      - ./deploy/docker/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - adniba

  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: adniba_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: adniba_db
      MYSQL_USER: adniba
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - adniba_mysql_data:/var/lib/mysql
      - ./deploy/docker/mysql.cnf:/etc/mysql/conf.d/adniba.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "adniba", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adniba

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: adniba_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - adniba

  # ── Queue worker: events (4 processes via --numprocs) ───────────────────────
  worker-events:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: adniba_worker_events
    restart: unless-stopped
    working_dir: /var/www/adniba
    command: >
      php artisan queue:work redis
        --queue=events
        --sleep=1
        --tries=3
        --backoff=5,30,60
        --timeout=30
        --max-jobs=1000
        --max-time=3600
    volumes:
      - .:/var/www/adniba
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 4        # horizontal scale for event throughput
    networks:
      - adniba

  # ── Queue worker: default ───────────────────────────────────────────────────
  worker-default:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: adniba_worker_default
    restart: unless-stopped
    working_dir: /var/www/adniba
    command: >
      php artisan queue:work redis
        --queue=default
        --sleep=3
        --tries=3
        --timeout=60
    volumes:
      - .:/var/www/adniba
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - adniba

volumes:
  adniba_mysql_data:
    driver: local

networks:
  adniba:
    driver: bridge
